<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#00f2fe" opacity="0.12" filter="blur(24px)" />

  <!-- Left Bracket < -->
  <path d="M 125 190 L 65 256 L 125 322" fill="none" stroke="url(#primaryGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Bracket > -->
  <path d="M 387 190 L 447 256 L 387 322" fill="none" stroke="url(#accentGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold Modern "M" glyph in center -->
  <path d="M 178 348 L 178 168 L 256 268 L 334 168 L 334 348" fill="none" stroke="url(#primaryGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Accent indicator dot -->
  <circle cx="256" cy="120" r="14" fill="#00f2fe" />
</svg>
